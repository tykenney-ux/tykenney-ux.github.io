<!DOCTYPE html>
<html data-bs-theme="dark">

<head>
    <meta charset="utf-8">
    <title> Zipcode Weather Query </title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <h2 class="h2 text-center">Zipcode Weather Query</h2>
    </header>
    <div class="container" id="page-container">
        <main>
            <div class="row" id=" form-row">
                <form class="d-flex flex-column" id="main-form">
                    <div class="row align-items-center">
                        <div class="col-md-8" id="main-form">
                            <label class="form-label">Zip Code:
                                <input class="form-control" type="text" id="zip" name="zip">
                            </label>
                            <span class="spinner-border" id="zip_loading" aria-hidden="true"></span>
                            <span id="zip_feedback"></span><br>

                            City: <span id="city"></span><br>
                            Latitude: <span id="latitude"></span><br>
                            Longitude: <span id="longitude"></span><br>
                            Temperature: <span id="temperature"> </span> &deg;F <br>
                            Weather: <span id="weather"></span><br>
                        </div>
                        <div class="col-md-4 text-center" id="main-img">
                            <span id="img_placement"></span>
                        </div>
                    </div>

                </form>
            </div>
        </main>


    </div>
    <div id="sources">
        <span id='sources' class="link-dark fw-bold "><a href="sources.html" target="_blank">sources</a></span>
    </div>
    <footer class="bg-dark text-white-50 small py-100">
        <div class="container d-flex flex-row md:flex-row align-items-center gap-4">
            <!--The footer will be added here -->
            <img src="img/csumb-logo.png" alt="CSUMB Logo">
            <div class="mb-1">
                <p>&copy; 2026 Tyler Kenney. All rights reserved.</p>
                <p>This site is for academic purposes only.</p>
                <p>CST 336 Internet Programming.</p>
                <!--Display CSUMB logo -->
            </div>
        </div>
    </footer>
    <script src="js/script.js"></script>
</body>

</html>
