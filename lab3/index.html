<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title> Sign Up Page </title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- <link rel="stylesheet" href="css/style.css"> -->
</head>

<body>
    <h1 class="display-3 fw-bold text-center"> Sign Up Form</h1>
    <div class="container mb-5" style="max-width: 700px;">
        <form class="card shadow-sm p-3 mb-4" id="signupForm" action="welcome.html">
            <div class="md:col-7 lg:col-8">
                <div class="row g-3">
                    <div class="row mb-3">
                        <div class="sm:col-4 themed-grid-col">
                            <label class="form-label"> First Name:
                                <input class="form-control" type="text" id="fName" name="fName"><br>
                            </label>
                        </div>

                        <div class="sm:col-4 themed-grid-col">
                            <label class="form-label">Last Name:
                                <input class="form-control" type="text" id="lName" name="lName"><br>
                            </label>
                        </div>
                    </div>
                    <div class="form-field">
                        Gender:
                        <label class="radio"><input type="radio" name="gender" value="m"> Male</label>
                        <label class="radio"><input type="radio" name="gender" value="f"> Female</label><br>
                    </div>
                    <div class="md:col-3">
                        <label class="form-label">Zip Code:
                            <input class="form-control" type="text" id="zip" name="zip"><br>
                        </label>
                        <div class="md:col-3">
                            City: <span id="city"></span><br>
                            Latitude: <span id="latitude"></span><br>
                            Longitude: <span id="longitude"></span><br><br>
                        </div>
                    </div>
                    <div>
                        <div class="md:col-3">
                            <label class="form-label">State:
                                <select id="state" name="state">
                                    <option value="">Loading states...</option>
                                </select><br>
                            </label>
                        </div>
                        <div class="md:col-4">
                            <label class="form-label">County:
                                <select id="county" name="county"></select><br>
                            </label>
                        </div>
                    </div>
                    <div class="md:col-4">
                        <label class="form-label">Desired Username:
                            <input class="form-control" type="text" id="username" name="username">
                        </label>
                        <span id="usernameError"></span><br>
                    </div>
                    <div>
                        <div class="md:col-4">
                            <label class="form-label">Password:
                                <input class="form-control" type="password" id="password" name="password"><br>
                            </label>
                            <br>
                            <button class="btn btn-secondary btn-sm rounded-pill px-3" type="button"
                                id="passwordbtn">Use</button>
                            <span id="suggestedPassword"></span><br>
                        </div>
                        <label class="form-label">Re-Enter Password:
                            <input class="form-control" type="password" id="passwordAgain" name="passwordAgain"><br>
                        </label>
                        <span id="passwordError"></span><br>
                    </div>
                    <div class="md:col-4">
                        <button class="btn-solid theme-primary rounded-pill px-3" type="submit" id="signUp">Sign
                            up!</button>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <footer class="bg-dark text-white-50 small py-4">
        <div class="container d-flex flex-row md:flex-row align-items-center gap-4">
            <!--The footer will be added here -->
            <img src="img/csumb-logo.png" alt="CSUMB Logo">
            <div class="mb-1">
                <p>&copy; 2026 Tyler Kenney. All rights reserved.</p>
                <p>This site is for academic purposes only.</p>
                <p>CST 336 Internet Programming.</p>
                <!--Display CSUMB logo -->
            </div>
        </div>
    </footer>
    <script src="js/script.js"></script>

</body>

</html>
